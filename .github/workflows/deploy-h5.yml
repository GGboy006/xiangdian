# 推 main 后自动构建 H5，发布到 GitHub Pages
# 地址：https://<用户名>.github.io/xiangdian/
name: Deploy H5 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build H5
        # 项目站路径是 /xiangdian/，必须与仓库名一致；若改仓库名请同步改这里
        env:
          VITE_APP_PUBLIC_BASE: /xiangdian/
        run: pnpm build:h5

      - name: SPA fallback for GitHub Pages
        run: cp dist/build/h5/index.html dist/build/h5/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/build/h5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
